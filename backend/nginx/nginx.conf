# API Gateway для платформы Mimi (см. практика 7, п. «API Gateway»).
# Задачи: маршрутизация /api/<service>/* по префиксу URL, CORS-заголовки
# и SSL-терминация (в prod). Для dev SSL отключён — фронтенд ходит по HTTP.
#
# В этом шаге активен только /api/auth. По мере добавления сервисов
# соответствующие upstream'ы раскомментируются.

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    client_max_body_size 10m;

    # Каждый сервис слушает :8080 в своём контейнере. NGINX резолвит имена
    # сервисов через docker DNS (resolver 127.0.0.11).
    upstream auth_upstream           { server auth-service:8080; }
    upstream users_upstream          { server users-service:8080; }
    upstream projects_upstream       { server projects-service:8080; }
    upstream tasks_upstream          { server tasks-service:8080; }
    upstream docs_upstream           { server docs-service:8080; }
    upstream boards_upstream         { server boards-service:8080; }
    upstream teams_upstream          { server teams-service:8080; }
    # upstream tasks_upstream          { server tasks-service:8080; }
    # upstream docs_upstream           { server docs-service:8080; }
    # upstream boards_upstream         { server boards-service:8080; }
    # upstream teams_upstream          { server teams-service:8080; }
    # upstream git_upstream            { server git-service:8080; }
    # upstream notifications_upstream  { server notifications-service:8080; }

    server {
        listen 80 default_server;
        server_name _;

        # Простая проверка состояния самого gateway'а.
        location = /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # CORS — для фронтенда на другом хосте в dev-среде.
        add_header Access-Control-Allow-Origin  "$http_origin"                  always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type"   always;
        add_header Access-Control-Allow-Credentials "true"                      always;

        # ── auth-service ─────────────────────────────────────────
        location /api/auth/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://auth_upstream/auth/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── users-service ────────────────────────────────────────
        location /api/users/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://users_upstream/users/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── projects-service ─────────────────────────────────────
        location /api/projects/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://projects_upstream/projects/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── tasks-service ────────────────────────────────────────
        location /api/tasks/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://tasks_upstream/tasks/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── docs-service ─────────────────────────────────────────
        location /api/docs/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://docs_upstream/docs/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── boards-service ───────────────────────────────────────
        location /api/boards/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://boards_upstream/boards/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── teams-service ────────────────────────────────────────
        # /api/teams/* и /api/invitations/* обслуживаются одним сервисом.
        location /api/teams/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://teams_upstream/teams/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
        location /api/invitations/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://teams_upstream/invitations/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── git-service ──────────────────────────────────────────
        # location /api/git/ { proxy_pass http://git_upstream/git/; }

        # ── notifications-service (SSE) ──────────────────────────
        # location /api/notifications/stream {
        #     proxy_pass http://notifications_upstream/notifications/stream;
        #     proxy_http_version 1.1;
        #     proxy_set_header Connection '';
        #     proxy_buffering off;
        #     proxy_cache off;
        #     proxy_read_timeout 24h;
        # }
        # location /api/notifications/ {
        #     proxy_pass http://notifications_upstream/notifications/;
        # }

        location / {
            return 404 '{"error":"not found"}';
            add_header Content-Type application/json;
        }
    }
}
