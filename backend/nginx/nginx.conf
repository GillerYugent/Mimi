# API Gateway для платформы Mimi (см. практика 7, п. «API Gateway»).
# Задачи: маршрутизация /api/<service>/* по префиксу URL, CORS-заголовки
# и SSL-терминация (в prod). Для dev SSL отключён — фронтенд ходит по HTTP.

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    client_max_body_size 10m;

    # Docker DNS — переразрешает имена сервисов каждые 10 секунд.
    # Это обязательно при использовании переменных в proxy_pass, иначе NGINX
    # кеширует IP на старте и не видит перезапущенные контейнеры.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Адреса сервисов вынесены в переменные, чтобы resolver работал корректно.
    # Статичные upstream-блоки не поддерживают динамическое DNS в NGINX OSS.
    map $host $auth_addr           { default auth-service:8080; }
    map $host $users_addr          { default users-service:8080; }
    map $host $projects_addr       { default projects-service:8080; }
    map $host $tasks_addr          { default tasks-service:8080; }
    map $host $docs_addr           { default docs-service:8080; }
    map $host $boards_addr         { default boards-service:8080; }
    map $host $teams_addr          { default teams-service:8080; }
    map $host $git_addr            { default git-service:8080; }
    map $host $notifications_addr  { default notifications-service:8080; }
    map $host $swagger_addr        { default swagger-ui:8080; }
    map $host $frontend_addr       { default frontend:80; }

    # Общие proxy-заголовки, вынесены в snippet через переменные.
    proxy_http_version 1.1;

    server {
        listen 80 default_server;
        server_name _;

        # Простая проверка состояния самого gateway'а.
        location = /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # CORS — для фронтенда на другом хосте в dev-среде.
        add_header Access-Control-Allow-Origin  "$http_origin"                  always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type"   always;
        add_header Access-Control-Allow-Credentials "true"                      always;

        # ── auth-service ─────────────────────────────────────────
        location /api/auth {
            if ($request_method = OPTIONS) { return 204; }
            rewrite ^/api/auth(.*) /auth$1 break;
            proxy_pass http://$auth_addr;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── users-service ────────────────────────────────────────
        location /api/users {
            if ($request_method = OPTIONS) { return 204; }
            rewrite ^/api/users(.*) /users$1 break;
            proxy_pass http://$users_addr;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── projects-service ─────────────────────────────────────
        location /api/projects {
            if ($request_method = OPTIONS) { return 204; }
            rewrite ^/api/projects(.*) /projects$1 break;
            proxy_pass http://$projects_addr;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── tasks-service ────────────────────────────────────────
        location /api/tasks {
            if ($request_method = OPTIONS) { return 204; }
            rewrite ^/api/tasks(.*) /tasks$1 break;
            proxy_pass http://$tasks_addr;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── docs-service ─────────────────────────────────────────
        location /api/docs {
            if ($request_method = OPTIONS) { return 204; }
            rewrite ^/api/docs(.*) /docs$1 break;
            proxy_pass http://$docs_addr;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── boards-service ───────────────────────────────────────
        location /api/boards {
            if ($request_method = OPTIONS) { return 204; }
            rewrite ^/api/boards(.*) /boards$1 break;
            proxy_pass http://$boards_addr;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── teams-service ────────────────────────────────────────
        # /api/teams/* и /api/invitations/* обслуживаются одним сервисом.
        location /api/teams {
            if ($request_method = OPTIONS) { return 204; }
            rewrite ^/api/teams(.*) /teams$1 break;
            proxy_pass http://$teams_addr;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
        location /api/invitations {
            if ($request_method = OPTIONS) { return 204; }
            rewrite ^/api/invitations(.*) /invitations$1 break;
            proxy_pass http://$teams_addr;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── git-service ──────────────────────────────────────────
        location /api/git {
            if ($request_method = OPTIONS) { return 204; }
            rewrite ^/api/git(.*) /git$1 break;
            proxy_pass http://$git_addr;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # API GitHub/GitLab может отвечать дольше — повышенный таймаут.
            proxy_read_timeout 60s;
        }

        # ── notifications-service (SSE) ──────────────────────────
        # SSE-стрим должен идти БЕЗ буферизации, иначе клиент не увидит
        # события в реальном времени. Поэтому /stream обрабатываем отдельным
        # location'ом с длинным таймаутом.
        location = /api/notifications/stream {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://$notifications_addr/notifications/stream;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            chunked_transfer_encoding on;
        }
        location /api/notifications {
            if ($request_method = OPTIONS) { return 204; }
            rewrite ^/api/notifications(.*) /notifications$1 break;
            proxy_pass http://$notifications_addr;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Swagger UI ───────────────────────────────────────────
        # Проксируем /docs/* к Swagger UI контейнеру. BASE_URL=/docs задаётся
        # в docker-compose, поэтому swagger-ui знает свой root path.
        location /docs {
            proxy_pass http://$swagger_addr;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── frontend (SPA) ───────────────────────────────────────
        # Любой не-/api путь идёт на контейнер фронтенда. Внутри его nginx
        # try_files отдаёт index.html для client-side routing.
        location / {
            proxy_pass http://$frontend_addr;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
