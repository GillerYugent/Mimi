# NGINX-конфиг внутри контейнера фронтенда. Просто отдаёт SPA.
# Внешний gateway (см. backend/nginx/nginx.conf) сам разделяет /api/*
# и /* — это nginx ничего не знает про backend.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck для Docker.
    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Долгий кэш для immutable-ассетов с хэшем в имени.
    location ~* \.(js|css|woff2|woff|ttf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: любой неизвестный путь → index.html, чтобы React
    # Router отрабатывал клиентский routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
